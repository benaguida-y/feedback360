spring:
  application:
    name: feedback360

  datasource:
    url: jdbc:postgresql://localhost:5432/feedback360
    username: feedback360
    password: devsecret

  jpa:
    hibernate:
      ddl-auto: validate     # Hibernate never changes the schema — only checks entities match
    show-sql: true           # log the SQL Hibernate runs (dev only)
    properties:
      hibernate:
        format_sql: true     # pretty-print that SQL

  flyway:
    enabled: true            # Flyway owns the schema, runs migrations at startup
    baseline-on-migrate: true

server:
  port: 8081


feedback360:
  webhook:
    api-key: dev-webhook-key-change-me
  jwt:
    secret: change-me-please-this-is-a-32byte-minimum-secret
  magic-link:
    base-url: http://localhost:5173
    ttl-days: 14