<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <style>
        {{styles}}
    </style>
</head>
<body>
<div class="wrap">
    <h2 class="title">Bienvenue sur Feedback360</h2>
    <p>Bonjour {{name}},</p>
    {{intro}}
    <p class="btn-wrap">
        <a href="{{link}}" class="btn">Activer mon compte</a>
    </p>
    <p class="muted">Si le bouton ne fonctionne pas, copiez ce lien :<br>{{link}}</p>
    <p class="muted">Si vous n'attendiez pas cet e-mail, vous pouvez l'ignorer.</p>
    <img src="cid:{{logoCid}}" alt="Feedback360" class="logo" />
</div>
</body>
</html>
